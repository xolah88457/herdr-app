# This fork's Apple Silicon download: an ad-hoc signed Herdr.dmg (no Apple
# certificate, no notarization). Push a tag `fork-v<version>` to attach it to a
# GitHub Release, or run the workflow by hand to get it as a workflow artifact.
# Not `v*`: that starts release.yml, which needs the upstream release secrets.
#
# Built without HERDR_APP_RELEASE: no self-update and no telemetry, so the app
# stays this fork instead of being replaced by upstream Herdr.
name: mac dmg
run-name: ${{ github.ref_type == 'tag' && format('dmg release {0}', github.ref_name) || format('dmg build {0}', github.ref_name) }}

on:
  workflow_dispatch:
  push:
    tags: ["fork-v*"]

permissions:
  contents: read

concurrency:
  group: mac-dmg-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.95.0
  # In the cache key: ghostty-sys can't tell when Zig changes.
  ZIG_VERSION: 0.16.0

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    outputs:
      dmg: ${{ steps.dmg.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &cache-paths |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: mac-dmg-v1-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: mac-dmg-v1-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-
      # No HERDR_APP_RELEASE here, on purpose (see the top of this file).
      - name: Build
        run: cargo build --release --locked
      - name: Save build cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *cache-paths
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Assemble Herdr.app and the dmg
        id: dmg
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          # A tag names the file (fork-v0.1.16 -> 0.1.16); otherwise Cargo.toml does.
          label=$cargo_version
          if [ "$REF_TYPE" = tag ]; then label=${REF_NAME#fork-v}; fi
          label=$(printf '%s' "$label" | tr -c 'A-Za-z0-9._-' '-')
          name="Herdr-$label-arm64.dmg"

          work="$RUNNER_TEMP/dmg"
          mkdir -p "$work/stage" dist
          # No PATH baked in: the app finds hc itself when Finder opens it
          # (core_bin::fill_path adds the login shell's PATH and ~/.local/bin).
          HERDR_BUNDLE_VERSION="$cargo_version" scripts/mac-bundle "$work/stage/Herdr.app"
          cp LICENSE THIRD-PARTY-NOTICES "$work/stage/Herdr.app/Contents/Resources/"
          codesign --force --deep --sign - "$work/stage/Herdr.app"
          codesign --verify --deep --strict "$work/stage/Herdr.app"
          ln -s /Applications "$work/stage/Applications"
          hdiutil create -volname Herdr -srcfolder "$work/stage" -ov -format UDZO "dist/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: herdr-dmg
          path: dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: herdr-dmg
          path: dist
      - name: Publish the dmg on the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DMG: ${{ needs.build.outputs.dmg }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$DMG" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "dist/$DMG" --repo "$REPO" --verify-tag \
              --title "Herdr $TAG" --generate-notes
          fi
